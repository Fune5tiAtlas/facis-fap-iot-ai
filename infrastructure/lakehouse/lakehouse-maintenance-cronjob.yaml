# ---------------------------------------------------------------------------
# Lakehouse maintenance CronJob — snapshot expiry + Iceberg compaction
#
# Runs maintain_lakehouse.py daily on every bronze, silver and gold table:
# expire_snapshots (bounds the table metadata), optimize (compacts small data
# files) and optimize_manifests. Without the expiry, each commit grows the
# table's metadata.json without limit, which is what exhausted the Trino
# coordinator's heap in November 2026; without the compaction, the
# single-row-insert ingest pattern pushes Trino query p95 past the QA
# thresholds (NF-9, audit 2026-07-24).
#
# Prerequisites (same cluster secret the materializers use):
#   1. Scripts ConfigMap (setup_lakehouse.py provides the connection that
#      maintain_lakehouse.py imports):
#        kubectl create configmap facis-maintenance-scripts \
#          --from-file=maintain_lakehouse.py=infrastructure/lakehouse/maintain_lakehouse.py \
#          --from-file=setup_lakehouse.py=infrastructure/lakehouse/setup_lakehouse.py \
#          --from-file=materialize_silver.py=infrastructure/lakehouse/materialize_silver.py \
#          --from-file=materialize_gold.py=infrastructure/lakehouse/materialize_gold.py \
#          -n stackable
#   2. Credentials secret facis-lakehouse-credentials (already created for the
#      materializers).
#
#   3. Catalog properties on the Stackable TrinoCatalog CR (see README.md,
#      "Required catalog settings"); the job fails without them.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: facis-lakehouse-maintenance
  namespace: stackable
  labels:
    app: facis-lakehouse-maintenance
    component: lakehouse
spec:
  # 03:15 daily — off-peak.
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # ~33 tables; a pass after a long gap took ~20 min per gold table.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: facis-lakehouse-maintenance
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
          - name: install-deps
            image: python:3.11-slim@sha256:b1b81d67b8df73bf6067191790c233ef9e598b863fc1ccf447956138ca466d99
            command: ["/bin/sh", "-c"]
            args:
            - pip install --target=/deps trino requests tabulate 2>&1 | tail -1
            volumeMounts:
            - name: deps
              mountPath: /deps
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
          containers:
          - name: maintenance
            image: python:3.11-slim@sha256:b1b81d67b8df73bf6067191790c233ef9e598b863fc1ccf447956138ca466d99
            command: ["/bin/sh", "-c"]
            args:
            - |
              export PYTHONPATH=/deps:/scripts
              python /scripts/maintain_lakehouse.py --env-file /config/.env
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: credentials
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: deps
            emptyDir: {}
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
          - name: scripts
            configMap:
              name: facis-maintenance-scripts
          - name: credentials
            secret:
              secretName: facis-lakehouse-credentials
