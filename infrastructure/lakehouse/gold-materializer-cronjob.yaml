# ---------------------------------------------------------------------------
# Gold Layer Materializer — Kubernetes CronJob
#
# Runs materialize_gold.py on a schedule to convert Gold views into
# materialized Iceberg tables for fast query performance. This manifest is
# the single source of truth for the Gold materializer; the equivalent Helm
# template in services/simulation/helm/facis-simulation is disabled by
# default and deprecated in favour of this file.
#
# Prerequisites:
#   1. ConfigMap with scripts:
#      kubectl create configmap facis-gold-scripts \
#        --from-file=materialize_gold.py=infrastructure/lakehouse/materialize_gold.py \
#        --from-file=setup_lakehouse.py=infrastructure/lakehouse/setup_lakehouse.py \
#        -n stackable
#
#   2. Secret with credentials (shared with Silver materializer):
#      kubectl create secret generic facis-lakehouse-credentials \
#        --from-env-file=.env.cluster -n stackable
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: facis-gold-materializer
  namespace: stackable
  labels:
    app: facis-gold-materializer
    component: lakehouse
spec:
  # Every 6 hours at minute 30. Gold aggregations are full-refresh and
  # cheap once silver is materialized; running more often would just churn
  # the same rollups. Schedule chosen to land 25 min after the silver
  # /10-min cycle, so a freshly-completed silver run feeds gold.
  schedule: "30 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 30-min runtime budget. Gold has 12 tables; on first catch-up after
      # a long stall they all rebuild full-refresh. The AuthRefreshingSession
      # in setup_lakehouse.py auto-refreshes the OIDC token across the
      # 5-min TTL boundary so this run can comfortably go past it.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: facis-gold-materializer
        spec:
          restartPolicy: Never
          initContainers:
          - name: install-deps
            image: python:3.11-slim
            command: ["/bin/sh", "-c"]
            args:
            - pip install --target=/deps trino requests tabulate 2>&1 | tail -1
            volumeMounts:
            - name: deps
              mountPath: /deps
          containers:
          - name: materializer
            image: python:3.11-slim
            command: ["/bin/sh", "-c"]
            args:
            - |
              export PYTHONPATH=/deps:/scripts
              python /scripts/materialize_gold.py --env-file /config/.env
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: credentials
              mountPath: /config
              readOnly: true
          volumes:
          - name: deps
            emptyDir: {}
          - name: scripts
            configMap:
              name: facis-gold-scripts
          - name: credentials
            secret:
              secretName: facis-lakehouse-credentials
