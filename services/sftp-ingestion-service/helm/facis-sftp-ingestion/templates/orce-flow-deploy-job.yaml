{{- if and (eq (default "orce" .Values.compatibilityMode) "orce") .Values.orceFlowDeploy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "facis-sftp-ingestion.fullname" . }}-orce-flow-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-sftp-ingestion.labels" . | nindent 4 }}
    app.kubernetes.io/component: orce-flow-deploy
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "facis-sftp-ingestion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orce-flow-deploy
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "facis-sftp-ingestion.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: flows
          configMap:
            name: {{ include "facis-sftp-ingestion.fullname" . }}-orce-flows
      containers:
        - name: deploy
          image: "{{ .Values.orceFlowDeploy.jobImage.repository }}:{{ .Values.orceFlowDeploy.jobImage.tag }}"
          imagePullPolicy: {{ .Values.orceFlowDeploy.jobImage.pullPolicy }}
          env:
            - name: ORCE_ADMIN_URL
              value: {{ .Values.orceFlowDeploy.orceAdminUrl | quote }}
            - name: ORCE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orceFlowDeploy.adminTokenSecret }}
                  key: token
            - name: PRE_DEPLOY_SLEEP
              value: {{ .Values.orceFlowDeploy.preDeploySleepSeconds | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "[orce-flow-deploy] waiting ${PRE_DEPLOY_SLEEP}s for ORCE readiness..."
              sleep "${PRE_DEPLOY_SLEEP}"

              # Poll the Admin API until it answers before deploying. On a first
              # install the dedicated ORCE pod may take minutes to come up (the
              # init-deps container compiles librdkafka), so a fixed sleep is
              # not enough. 200 = reachable/open, 401 = reachable but auth-gated
              # — either means the HTTP server is serving; keep waiting on
              # connection errors (000) or 5xx. Up to 60 tries × 5s = 5 minutes.
              echo "[orce-flow-deploy] polling ${ORCE_ADMIN_URL}/flows for readiness..."
              i=0
              while [ "$i" -lt 60 ]; do
                CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${ORCE_ADMIN_TOKEN}" \
                  -H "Node-RED-API-Version: v2" \
                  "${ORCE_ADMIN_URL}/flows" || echo 000)
                if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                  echo "[orce-flow-deploy] ORCE reachable (http $CODE)"
                  break
                fi
                i=$((i + 1))
                echo "[orce-flow-deploy] not ready (http $CODE), retry $i/60"
                sleep 5
              done

              cd /flows
              # Single atomic POST /flows (v2, Node-RED-Deployment-Type:
              # nodes) built by merging this chart's tabs into the live
              # GET /flows result by node id — NEVER a naive full-replace
              # from this chart's files alone. This pod is shared with
              # Simulation/AI-Insight/SFTP flows; truncating to just what
              # this chart renders would wipe every other service's tabs
              # (the known destructive-deploy hazard — see
              # feedback_orce_full_deploy_destructive in project memory).
              # Starting from the live GET result and only replacing node
              # ids that belong to THIS chart's tabs avoids that entirely.
              #
              # Why not per-tab PUT/POST like before: PUT /flow/:id only
              # works once a tab already exists under that exact id: the
              # id it was FIRST created with. Creating a new tab has to go
              # through POST /flow (singular, "add a flow"), and that
              # endpoint unconditionally overwrites whatever id is in the
              # payload with a fresh, random one — confirmed by reading
              # @node-red/runtime/lib/flows/index.js's addFlow:
              # `flow.id = redUtil.generateId();`, no way to opt out. So a
              # tab created that way could never be found again by the id
              # in its own source file on the next deploy — PUT would
              # 404, fall back to POST, and create a SECOND tab with a
              # second random id, whose nodes collide with the first
              # copy's ("duplicate id"). POST /flows (plural, the whole
              # config) is the only admin-API path that takes node ids
              # as given, because it treats the payload as the intended
              # full state and diffs it against what is currently
              # running rather than allocating anything.
              TMP=/tmp
              RESPONSE=$(curl -sS -w '\n___HTTP_STATUS___:%{http_code}' \
                -H "Authorization: Bearer ${ORCE_ADMIN_TOKEN}" \
                -H "Node-RED-API-Version: v2" \
                "${ORCE_ADMIN_URL}/flows")
              HTTP_CODE=$(printf '%s' "$RESPONSE" | grep -o '___HTTP_STATUS___:[0-9]*$' | cut -d: -f2)
              BODY=$(printf '%s' "$RESPONSE" | sed -e 's/___HTTP_STATUS___:[0-9]*$//')
              if [ "$HTTP_CODE" != "200" ]; then
                echo "[orce-flow-deploy] FAIL fetching current flows: http $HTTP_CODE"
                echo "{\"event\":\"orce-flow-deploy\",\"chart\":\"{{ .Chart.Name }}\",\"phase\":\"fetch-current\",\"status\":\"failed\",\"http_code\":\"$HTTP_CODE\"}"
                echo "$BODY"
                exit 1
              fi
              printf '%s' "$BODY" > "$TMP/current-flows.json"
              REV=$(jq -r '.rev' "$TMP/current-flows.json")
              jq -c '.flows' "$TMP/current-flows.json" > "$TMP/merged.json"

              for f in *.json; do
                TAB_ID=$(jq -r '[.[] | select(.type=="tab" or .type=="subflow") | .id] | first // empty' "$f")
                if [ -z "$TAB_ID" ]; then
                  echo "[orce-flow-deploy] SKIP $f — no tab object found"
                  continue
                fi
                # Drop every node from the live set whose id is about to be
                # reinserted from this file (the old tab node itself, plus
                # every one of its child/config nodes, matched by id — not
                # by z, since config nodes commonly have no z at all), then
                # append this file's nodes verbatim.
                NEW_IDS=$(jq -c '[.[].id]' "$f")
                jq -c --argjson newids "$NEW_IDS" \
                  'map(select(.id as $i | ($newids | index($i)) == null))' \
                  "$TMP/merged.json" > "$TMP/merged.filtered.json"
                jq -s '.[0] + .[1]' "$TMP/merged.filtered.json" "$f" > "$TMP/merged.json"
                echo "[orce-flow-deploy] merged $f (tab $TAB_ID)"
              done

              jq -n --arg rev "$REV" --slurpfile flows "$TMP/merged.json" \
                '{rev: $rev, flows: $flows[0]}' > "$TMP/deploy-payload.json"

              RESPONSE=$(curl -sS -w '\n___HTTP_STATUS___:%{http_code}' \
                -H "Authorization: Bearer ${ORCE_ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Node-RED-API-Version: v2" \
                -H "Node-RED-Deployment-Type: nodes" \
                -X POST "${ORCE_ADMIN_URL}/flows" \
                --data "@$TMP/deploy-payload.json")
              HTTP_CODE=$(printf '%s' "$RESPONSE" | grep -o '___HTTP_STATUS___:[0-9]*$' | cut -d: -f2)
              BODY=$(printf '%s' "$RESPONSE" | sed -e 's/___HTTP_STATUS___:[0-9]*$//')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "[orce-flow-deploy] deploy ok (single atomic POST /flows, nodes mode)"
                echo "{\"event\":\"orce-flow-deploy\",\"chart\":\"{{ .Chart.Name }}\",\"phase\":\"post-flows\",\"status\":\"ok\",\"http_code\":\"$HTTP_CODE\"}"
              else
                echo "[orce-flow-deploy] FAIL deploying merged flows: http $HTTP_CODE"
                echo "{\"event\":\"orce-flow-deploy\",\"chart\":\"{{ .Chart.Name }}\",\"phase\":\"post-flows\",\"status\":\"failed\",\"http_code\":\"$HTTP_CODE\"}"
                echo "$BODY"
                exit 1
              fi
          volumeMounts:
            - name: flows
              mountPath: /flows
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
{{- end }}
