# Eclipse DSP TCK configuration — FACIS DSP connector under test (NF-7).
# Catalogue + transfer suites against an already-running connector.
# Docs: services/dsp-connector/tck/README.md

dataspacetck.debug=false
dataspacetck.dsp.local.connector=false

# Where the TCK's own connector listens for the CUT's async DSP callbacks.
# The CUT must be able to reach this address.
dataspacetck.callback.address=http://host.docker.internal:8083

dataspacetck.dsp.connector.agent.id=urn:connector:facis-dsp
# Adjust to the deployed DSP ORCE base (dedicated DSP runtime service).
dataspacetck.dsp.connector.http.url=http://host.docker.internal:1880/dsp
dataspacetck.dsp.connector.http.base.url=http://host.docker.internal:1880

# Consumer-role tests (TP_C) need this bespoke initiate webhook on the CUT.
# Not implemented by FACIS yet — see the gap register in README.md.
dataspacetck.dsp.connector.transfer.initiate.url=http://host.docker.internal:1880/tck/transfers/requests

# Suites: catalogue (includes metadata MET tests) + transfer process.
dataspacetck.filters.tags.include=dsp-cat,dsp-tp
dataspacetck.dsp.default.wait=10000

# Pre-seeded IDs the TCK expects the CUT to know. The catalogue derive flow /
# datasets.json must contain these dataset ids; agreements must be seeded via
# POST /dsp/negotiations before the run (see README step 3).
CAT_01_01_DATASETID=CAT0101
CAT_01_02_DATASETID=CAT0102
CAT_01_03_DATASETID=CAT0103
TP_01_01_AGREEMENTID=ATP0101
TP_01_01_FORMAT=HttpData-PULL
TP_01_02_AGREEMENTID=ATP0102
TP_01_02_FORMAT=HttpData-PULL
TP_01_03_AGREEMENTID=ATP0103
TP_01_03_FORMAT=HttpData-PULL
TP_02_01_AGREEMENTID=ATP0201
TP_02_01_FORMAT=HttpData-PULL
TP_02_02_AGREEMENTID=ATP0202
TP_02_02_FORMAT=HttpData-PULL
TP_03_01_AGREEMENTID=ATP0301
TP_03_01_FORMAT=HttpData-PULL
