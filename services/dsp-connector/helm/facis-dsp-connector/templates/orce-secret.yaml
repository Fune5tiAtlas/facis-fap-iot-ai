apiVersion: v1
kind: Secret
metadata:
  name: {{ include "facis-dsp-connector.fullname" . }}-dsp-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-dsp-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  DSP_HMAC_SECRET: {{ required "dsp.hmacSecret is required (e.g. openssl rand -hex 32)" .Values.dsp.hmacSecret | quote }}
  DSP_DATA_API_BASE_URL: {{ .Values.dsp.dataApiBaseUrl | quote }}
  DSP_DEFAULT_TTL_SECONDS: {{ .Values.dsp.defaultTtlSeconds | quote }}
  DSP_KAFKA_BOOTSTRAP: {{ .Values.dsp.kafkaBootstrap | quote }}
  DSP_IAM_ENFORCE: {{ .Values.dsp.iam.enforce | quote }}
  DSP_VP_AUDIENCE: {{ .Values.dsp.iam.vpAudience | quote }}
  DSP_TRUSTED_ISSUERS: {{ .Values.dsp.iam.trustedIssuers | quote }}
  DSP_IAM_JTI_TTL_SECONDS: {{ .Values.dsp.iam.jtiTtlSeconds | quote }}
  DSP_IAM_DID_CACHE_TTL_SECONDS: {{ .Values.dsp.iam.didCacheTtlSeconds | quote }}
  DSP_IAM_CATALOGUE: {{ .Values.dsp.iam.catalogueMode | quote }}
  DSP_CONNECTOR_DID: {{ .Values.dsp.iam.connectorDid | quote }}
  DSP_STATUS_LIST_MODE: {{ .Values.dsp.iam.statusListMode | quote }}
  DSP_VERIFIER_MODE: {{ .Values.dsp.iam.verifierMode | quote }}
  DSP_VERIFIER_URL: {{ .Values.dsp.iam.verifierUrl | quote }}
  DSP_OID4VCI_SHARED_SECRET: {{ .Values.dsp.iam.oid4vciSharedSecret | quote }}
  DSP_GXDCH_NOTARY_URL: {{ .Values.dsp.iam.gxdch.notaryUrl | quote }}
  DSP_GXDCH_COMPLIANCE_URL: {{ .Values.dsp.iam.gxdch.complianceUrl | quote }}
  # NOTE: this is the in-cluster-default Mongo URI only. If dsp.iam.mongo.uriSecret
  # is ever set, wire a separate envFrom/valueFrom.secretKeyRef to that external
  # Secret instead — left as a follow-up since no environment sets it today.
  # Also baked (same in-cluster-default-only limitation) into
  # orce-flows-configmap.yaml's ${DSP_MONGO_URI} substitution for the mongo
  # client config node, which reads this value literally, not via env.get().
  DSP_MONGO_URI: {{ if .Values.dsp.iam.mongo.uriSecret }}{{ "" }}{{ else }}{{ printf "mongodb://%s-mongo:27017/identity_hub" (include "facis-dsp-connector.fullname" .) | quote }}{{ end }}
  DSP_TRINO_URL: {{ .Values.dsp.trino.url | quote }}
  DSP_TRINO_CATALOG: {{ .Values.dsp.trino.catalog | quote }}
  DSP_TRINO_USER: {{ .Values.dsp.trino.user | quote }}
  DSP_TRINO_PASSWORD: {{ .Values.dsp.trino.password | quote }}
  DSP_INGEST_TOPIC: {{ .Values.dsp.ingestTopic | quote }}
  SFTP_KAFKA_BROKERS: {{ .Values.dsp.kafkaBrokers | quote }}
  {{- if .Values.dsp.pg.enabled }}
  DSP_PG_PASSWORD: {{ required "dsp.pg.password is required when dsp.pg.enabled (openssl rand -hex 16)" .Values.dsp.pg.password | quote }}
  DSP_PG_URI: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.dsp.pg.user .Values.dsp.pg.password (include "facis-dsp-connector.fullname" .) .Values.dsp.pg.database | quote }}
  {{- end }}
