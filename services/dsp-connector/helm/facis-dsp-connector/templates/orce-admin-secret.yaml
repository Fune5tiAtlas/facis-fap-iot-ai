{{- if .Values.dedicatedOrce.enabled }}
# Admin API bearer token for THIS chart's dedicated ORCE instance. The
# dedicated ORCE pod's default settings.js reads ORCE_ADMIN_TOKEN from env to
# gate its Admin API (same mechanism the shared instance uses); the
# flow-deploy Job reads the same token from this Secret and sends it as
# `Authorization: Bearer`. Both must agree, so both point at this one Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "facis-dsp-connector.fullname" . }}-orce-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-dsp-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: orce-admin
type: Opaque
stringData:
  {{- /* trim: tolerate a trailing newline from --set-file token sources —
       a newline inside the token breaks Authorization headers */}}
  token: {{ required "dedicatedOrce.adminToken is required when dedicatedOrce.enabled (e.g. openssl rand -hex 32)" .Values.dedicatedOrce.adminToken | trim | quote }}
{{- end }}
