{{- /*
NF-10 (audit 2026-07-23): render the connector's DID identity-key Secret from an
inline value so a clean `helm install` is self-contained. Without this, the
deployment referenced a fixed-name Secret the chart never created, and a fresh
install failed with CreateContainerConfigError ("secret ...-identity-key not
found"). When dsp.iam.privateJwk is empty, nothing is rendered here and the
deployment falls back to the pre-created dsp.iam.keySecret (the prod path).
*/ -}}
{{- if .Values.dsp.iam.privateJwk }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "facis-dsp-connector.fullname" . }}-identity-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-dsp-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  privateJwk: {{ .Values.dsp.iam.privateJwk | quote }}
{{- end }}
