{{- if .Values.dsp.iam.mongo.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "facis-dsp-connector.fullname" . }}-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-dsp-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-hub-mongo
spec:
  serviceName: {{ include "facis-dsp-connector.fullname" . }}-mongo
  replicas: 1
  selector:
    matchLabels:
      {{- include "facis-dsp-connector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: identity-hub-mongo
  template:
    metadata:
      labels:
        {{- include "facis-dsp-connector.labels" . | nindent 8 }}
        app.kubernetes.io/component: identity-hub-mongo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongo
          image: "{{ .Values.dsp.iam.mongo.image.repository }}:{{ .Values.dsp.iam.mongo.image.tag }}"
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.dsp.iam.mongo.storageSize }}
{{- end }}
